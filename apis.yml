aid: superai
name: Super.ai
description: >-
  super.AI is an intelligent document processing (IDP) platform that automates the
  extraction and processing of complex, multi-page documents such as invoices, contracts,
  and bills of lading, improving accuracy as users correct its output. Its developer
  product, SuperAI Flows, is a workflow orchestration platform for building durable,
  AI-powered automations through a simple REST API: design flows that orchestrate AI
  models, data processing, human-review tasks, and business logic, then run them
  synchronously via polling or asynchronously via webhooks. The API covers flows, flow
  executions, task executions and outputs, human review, integrations (email, storage,
  databases), files, models, service accounts, SSO, and organization management, with
  JWT bearer and service-account API-key authentication. super.AI serves financial
  services, insurance, logistics, shared services, and testing/inspection/certification.
