apis:
- aid: superai:superai-auth-api
  name: Super.ai auth API
  description: >-
    Authentication operations for user authentication, authorization, and session management.


    Authentication endpoints handle user identity verification, token generation, and access control throughout
    the platform. The system uses JWT (JSON Web Token) based authentication managed through core.flows.super.ai.


    **Authentication flow:**

    1. Obtain credentials from your account at core.flows.super.ai

    2. Authenticate to receive JWT access token and refresh token

    3. Include access token in API requests via Authorization header

    4. API validates tokens and extracts user identity and organization context

    5. Tokens expire after 1 hour and must be refreshed


    **Key concepts:**

    - **Bearer Tokens**: Short-lived JWT tokens (1 hour) used for API requests

    - **Anon-Key**: Long-lived API key used to authenticate to the authentication API.

    - **Refresh Tokens**: Long-lived tokens used to obtain new access tokens

    - **Protected Routes**: Most endpoints require valid authentication

    - **Public Endpoints**: Limited whitelisted paths accessible without auth


    **Getting started with authentication:**


    1. **Obtain your Anonymous Key** (public endpoint - no authentication required):
       ```bash
       curl https://flows.super.ai/api/auth/anon-key
       ```

    2. **Authenticate** to receive your tokens:
       ```bash
       curl -X POST 'https://core.flows.super.ai/auth/v1/token?grant_type=password' \
         -H 'Content-Type: application/json' \
         -H 'apikey: ANON_KEY' \
         -d '{"email": "you@example.com", "password": "your-password"}'
       ```
       This will return a JWT access token and refresh token.

    3. **Use the access token** in your requests:
       ```bash
       curl -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
            https://flows.super.ai/api/flows
       ```

    **Token management:**

    - Access tokens expire after 1 hour

    - Use refresh tokens to obtain new access tokens without re-authenticating

    - Store tokens securely and never commit them to version control


    All API endpoints (except whitelisted public paths) require authentication. Include your bearer token
    in the Authorization header: `Bearer <token>`
  humanURL: https://docs.flows.super.ai
  baseURL: https://flows.super.ai/api
  tags:
  - Authentication
  tags_raw:
  - auth
  properties:
  - type: OpenAPI
    url: openapi/superai-auth-api-openapi.yml
  - type: APIReference
    url: https://docs.flows.super.ai/api-reference
  - type: Authentication
    url: authentication/superai-authentication.yml
- aid: superai:superai-files-api
  name: Super.ai files API
  description: >-
    File download operations for retrieving files from gs:// storage URIs.


    When Super.AI Flows processes documents, task outputs often include file references as `gs://` URIs
    pointing to Google Cloud Storage. These endpoints let you download those files without needing to
    understand GCS internals or parse storage URLs.


    **The problem these endpoints solve:**


    Previously, downloading a file required:

    1. Recognizing the URL as a GCS reference

    2. Parsing out the file key from the URI

    3. Calling a separate endpoint to get a signed URL

    4. Downloading using that signed URL


    **Now it's simple:** Pass the `gs://` URI exactly as received and get your file.


    **Two ways to download:**


    1. **Direct download** (`GET /files/download`): Returns a redirect to the file. Perfect for curl with
    `-L` flag.
       ```
       curl -L -H "X-API-Key: saf_xxx" "https://flows.super.ai/api/files/download?uri=gs://..." -o file.pdf
       ```

    2. **Resolve first** (`POST /files/resolve`): Returns a JSON response with the download URL. Better
    for programmatic use and sensitive files (keeps URI out of logs).
       ```
       curl -X POST "https://flows.super.ai/api/files/resolve" \
         -H "X-API-Key: saf_xxx" \
         -H "Content-Type: application/json" \
         -d '{"uri": "gs://..."}'
       ```

    **Security:**

    - Files are organization-scoped: you can only download files from flows your organization owns

    - URIs are validated to prevent path traversal attacks

    - Download URLs expire after 1 hour


    **Common use cases:**

    - Download processed documents from completed flow executions

    - Retrieve extracted data files from task outputs

    - Integrate file downloads into automated pipelines
  humanURL: https://docs.flows.super.ai
  baseURL: https://flows.super.ai/api
  tags:
  - File
  tags_raw:
  - files
  properties:
  - type: OpenAPI
    url: openapi/superai-files-api-openapi.yml
  - type: APIReference
    url: https://docs.flows.super.ai/api-reference
  - type: Authentication
    url: authentication/superai-authentication.yml
- aid: superai:superai-flow-executions-api
  name: Super.ai flow-executions API
  description: >-
    Flow execution operations for running and monitoring workflows.


    Flow executions represent runtime instances of flows. When you execute a flow, a new flow execution
    is created with its own unique ID, status, and execution context. Each execution is independent and
    maintains its own state, input data, and results.


    **Key concepts:**

    - **Execution Status**: Tracks the lifecycle (running, completed, failed, cancelled)

    - **Run Number**: Sequential identifier for executions of the same flow

    - **Execution Context**: Contains input parameters, user information, and metadata

    - **Task Results**: Stores outputs from each task within the execution


    **Use these endpoints to:**

    - Start new flow executions with custom input parameters

    - Monitor execution progress and status in real-time

    - Retrieve execution history and detailed results

    - Filter and search executions by status, date, or flow

    - Cancel running executions when needed

    - Access task-level execution details and outputs


    Flow executions transform flow definitions into actual work and deliverable results.
  humanURL: https://docs.flows.super.ai
  baseURL: https://flows.super.ai/api
