          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'Unique request identifier in ULID format for debugging and support. Example: 01K8KABR6S16YETA2SZPVBS9SP'
      type: object
      required:
      - error
      title: ErrorResponse
      description: "Standard API error response structure.\n\nAll error responses from the API follow this format, ensuring\nconsistent error handling for API consumers.\n\nExample:\n    {\n        \"error\": {\n            \"message\": \"Flow not found\",\n            \"code\": \"not_found\"\n        },\n        \"request_id\": \"01K8KABR6S16YETA2SZPVBS9SP\"\n    }"
      examples:
      - error:
          code: not_found
          message: Resource not found
        request_id: 01K8KABR6S16YETA2SZPVBS9SP
    QueryTableRequest:
      properties:
        matches:
          items:
            oneOf:
            - $ref: '#/components/schemas/WholeMatch'
            - $ref: '#/components/schemas/IsNullMatch'
            - $ref: '#/components/schemas/JsonKeysMatch'
            discriminator:
              propertyName: mode
              mapping:
                is_null: '#/components/schemas/IsNullMatch'
                json_keys: '#/components/schemas/JsonKeysMatch'
                whole: '#/components/schemas/WholeMatch'
          type: array
          title: Matches
          description: List of match clauses combined by `combinator` at the top level. Empty list returns all rows up to limit.
        combinator:
          type: string
          enum:
          - AND
          - OR
          title: Combinator
          description: How top-level match clauses join. 'AND' requires every clause to match; 'OR' returns rows that satisfy at least one clause.
          default: AND
        order_by:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/OrderByColumn'
            - $ref: '#/components/schemas/OrderByRandom'
            discriminator:
              propertyName: kind
              mapping:
                column: '#/components/schemas/OrderByColumn'
                random: '#/components/schemas/OrderByRandom'
          - type: 'null'
          title: Order By
          description: How to order results. Either a column with direction (kind='column') or a SQL-level random sample (kind='random'). Defaults to no ORDER BY clause.
        limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          description: Max rows to return
          default: 100
      type: object
      title: QueryTableRequest
      description: Request to query a managed-DB table with exact-match clauses and a row limit.
