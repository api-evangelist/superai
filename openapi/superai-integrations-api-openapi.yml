openapi: 3.2.0
info:
  title: SuperAI Flow Platform Integrations API
  description: SuperAI Flows is a workflow orchestration platform that enables you to design, deploy, and monitor automated workflows at scale.
  version: 0.1.0
tags:
- name: Integrations
  description: Integration operations for connecting flows to external services and platforms.
  x-displayName: Integrations
paths:
  /api/integrations/database:
    get:
      tags:
      - Integrations
      summary: List user databases
      description: 'List all databases accessible to the authenticated user.


        Returns all databases, including:

        - Database metadata and configuration

        - Row and column counts

        - Creation and update timestamps

        - Current status


        Use Cases:

        - Display databases in UI

        - Select database for workflow configuration

        - Monitor database integration status'
      operationId: list_databases_api_integrations_database_get
      responses:
        '200':
          description: List of databases successfully retrieved
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Databases Api Integrations Database Get
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
      security:
      - BearerAuth: []
      - APIKeyAuth: []
    post:
      tags:
      - Integrations
      summary: Create Database
      description: Create a new CSV database instance.
      operationId: create_database_api_integrations_database_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFileCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed:
    post:
      tags:
      - Integrations
      summary: Create managed database
      description: 'Create a managed PostgreSQL database for the organization.


        Creates a dedicated database on the customer Cloud SQL instance with:

        - Database name: tenant_{org_id}

        - Role: tenant_{org_id}_rw with ALL PRIVILEGES

        - app_admin user can CONNECT and SET ROLE to access the database


        Only one managed database per organization is allowed.


        Use Cases:

        - Create isolated database for organization data

        - Store structured data with SQL queries

        - Enable multi-tenant data isolation'
      operationId: create_managed_database_api_integrations_database_managed_post
      responses:
        '201':
          description: Managed database created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileResponse'
        '409':
          description: Database already exists for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed/tables:
    get:
      tags:
      - Integrations
      summary: List tables in managed database
      description: 'List all tables in a managed database with row counts.


        Returns table names and their row counts for schema management.

        Uses organization_id from user context to identify the database.


        Use Cases:

        - Display available tables in schema management UI

        - Monitor table sizes'
      operationId: list_managed_database_tables_api_integrations_database_managed_tables_get
      responses:
        '200':
          description: List of tables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
      security:
      - BearerAuth: []
      - APIKeyAuth: []
    post:
      tags:
      - Integrations
      summary: Create table in managed database
      description: 'Create a new table in a managed database.


        Creates a table with specified columns using tenant_admin credentials.

        Uses organization_id from user context to identify the database.


        Use Cases:

        - Add new tables to managed database

        - Define custom schema for organization data'
      operationId: create_managed_database_table_api_integrations_database_managed_tables_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
        required: true
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTableResponse'
        '400':
          description: Invalid table definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed/tables/{table_name}/columns:
    get:
      tags:
      - Integrations
      summary: Get table columns from managed database
      description: 'Get column definitions from a table in a managed database.


        Returns column names and types for foreign key reference selection.


        Use Cases:

        - Display available columns for foreign key selection

        - Validate foreign key references'
      operationId: get_managed_database_table_columns_api_integrations_database_managed_tables__table_name__columns_get
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Table Name
      responses:
        '200':
          description: Table columns retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableColumnsResponse'
        '404':
          description: Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed/tables/{table_name}/data:
    get:
      tags:
      - Integrations
      summary: Get table data from managed database
      description: 'Get all data from a table in a managed database.


        Uses app_admin with SET ROLE to fetch data with read-only access.

        Uses organization_id from user context to identify the database.


        Use Cases:

        - Display table contents in schema management UI

        - View organization data'
      operationId: get_managed_database_table_data_api_integrations_database_managed_tables__table_name__data_get
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Table Name
      responses:
        '200':
          description: Table data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataResponse'
        '404':
          description: Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed/tables/{table_name}/rows:
    post:
      tags:
      - Integrations
      summary: Insert one row into a managed-DB table
      description: 'Insert a single row into a managed-DB table and return the inserted row.


        Column names in `values` must match the table schema. Values are bound via parameterised SQL.'
      operationId: insert_managed_database_row_api_integrations_database_managed_tables__table_name__rows_post
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Table Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertRowRequest'
      responses:
        '201':
          description: Row inserted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertRowResponse'
        '400':
          description: Invalid values payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Constraint violation (unique / FK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid value for column type / NOT NULL / unknown column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/managed/tables/{table_name}/query:
    post:
      tags:
      - Integrations
      summary: Query a managed-DB table with exact-match filters
      description: 'Run a parameterised SELECT against a managed-DB table.


        Supports a list of match clauses against columns. Each clause is either a ''whole'' exact-match

        or a ''json_keys'' match against keys inside a JSONB column. Clauses combine via `combinator` at

        the top level (AND or OR; defaults to AND). Returns rows ordered by `order_by` if provided,

        capped to `limit` (max 1000). The API surface is generic — ICL is the first consumer ("Write

        To Database" + ICL Retrieve tasks); future use cases reuse it without bespoke service methods.'
      operationId: query_managed_database_table_api_integrations_database_managed_tables__table_name__query_post
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Table Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTableRequest'
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryTableResponse'
        '400':
          description: Invalid query payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid value for column type / unknown column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/{db_id}:
    get:
      tags:
      - Integrations
      summary: Get database by ID
      description: 'Retrieve detailed information for a specific database.


        Returns complete database configuration including:

        - Database metadata (name, description, status)

        - File information (location, size)

        - Schema details (row count, column count)

        - Timestamps and audit information


        Use Cases:

        - Display database details in UI

        - Validate database exists before operations

        - Retrieve configuration for workflow tasks'
      operationId: get_database_api_integrations_database__db_id__get
      parameters:
      - name: db_id
        in: path
        required: true
        schema:
          type: string
          title: Db Id
      responses:
        '200':
          description: Database details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Database Api Integrations Database  Db Id  Get
        '404':
          description: Database not found with the specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
    delete:
      tags:
      - Integrations
      summary: Delete database
      description: 'Delete a database integration.


        Removes the database integration and its associated CSV file from storage.

        This operation may affect workflows that reference this database.


        Permissions enforced at RLS level:

        - Admins can delete any database within their organization.

        - Non-admin users can only delete databases they uploaded themselves.'
      operationId: delete_database_api_integrations_database__db_id__delete
      parameters:
      - name: db_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Db Id
      responses:
        '200':
          description: Database deleted successfully
          content:
            application/json:
              schema:
                type: boolean
                title: Response Delete Database Api Integrations Database  Db Id  Delete
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions to access this resource
          content:
            application/json:
              examples:
                insufficient_permissions:
                  summary: Insufficient permissions
                  value:
                    error:
                      message: You do not have permission to access this resource
                      code: forbidden
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                wrong_organization:
                  summary: Resource belongs to different organization
                  value:
                    error:
                      message: This resource belongs to a different organization
                      code: forbidden
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/database/{db_id}/download:
    get:
      tags:
      - Integrations
      summary: Get Download Url
      description: Generate pre-signed URL for downloading the database CSV file.
      operationId: get_download_url_api_integrations_database__db_id__download_get
      parameters:
      - name: db_id
        in: path
        required: true
