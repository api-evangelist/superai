  /api/integrations/credentials/provider/{provider}:
    get:
      tags:
      - Integrations
      summary: List credentials by provider
      description: 'Retrieve user credentials filtered by integration provider.


        Returns credentials for a specific integration provider. This is useful when you need to

        find credentials for a particular service without fetching all credentials.


        Context:

        This endpoint provides filtered access to credentials, commonly used when:

        - Checking if a user has connected to a specific provider (e.g., SharePoint)

        - Populating provider-specific integration configuration UI

        - Validating credential availability before initiating provider-specific workflows

        - Building provider selection dropdowns with availability indicators


        Use Cases:

        Check if user has SharePoint credentials before showing SharePoint site picker.


        Filter credentials for Google provider to display connected Google accounts in UI.


        Validate SFTP credential availability before configuring file upload task.

        Related Endpoints:

        - GET /integrations/credentials - Get all credentials (unfiltered)

        - POST /integrations/credentials - Create new credential for a provider

        - GET /integrations/catalog - List all available providers


