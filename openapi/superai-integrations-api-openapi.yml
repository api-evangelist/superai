components:
  schemas:
    IntegrationCategory:
      type: string
      enum:
      - automation
      - human_in_the_loop
      - database
      - messaging
      - agent_in_the_loop
      - storage
      title: IntegrationCategory
      description: Integration category
    EmailTaskResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Unique task identifier
        email_address:
          type: string
          title: Email Address
          description: Generated email address
        status:
          type: string
          title: Status
          description: Task status
          default: active
        name:
          type: string
          title: Name
          description: Task name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Task description
      type: object
      required:
      - task_id
      - email_address
      - name
      title: EmailTaskResponse
      description: Response from email task creation.
    IsNullMatch:
      properties:
        mode:
          type: string
          const: is_null
          title: Mode
          default: is_null
        column:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Column
          description: Column that must be NULL
          examples:
          - completed_at
      additionalProperties: false
      type: object
      required:
      - column
      title: IsNullMatch
      description: 'Match clause for NULL values: `"col" IS NULL`.


        Use this in place of trying to match `value: null` — `WHERE col = NULL` is always false in SQL.'
    CredentialTypeEnum:
      type: string
      enum:
      - api_key
      - oauth2
      - user_password
      - key_file
      - client_credentials
      - sharepoint_receive
      - google_drive_receive
      - sftp
      - azure_blob_receive
      title: CredentialTypeEnum
    DatabaseColumnsResponse:
      properties:
        database_id:
          type: string
          title: Database Id
          description: Database identifier
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        columns:
          items:
            type: string
          type: array
          title: Columns
          description: List of column names in the database
          examples:
          - - id
            - name
            - email
            - created_at
            - revenue
            - region
        column_count:
          type: integer
          minimum: 0.0
          title: Column Count
          description: Total number of columns
          examples:
          - 6
      type: object
      required:
      - database_id
      - columns
      - column_count
      title: DatabaseColumnsResponse
      description: 'Response containing database column information.


        Returned by GET /database/{db_id}/columns endpoint.'
      example:
        column_count: 6
        columns:
        - id
        - name
        - email
        - created_at
        - revenue
        - region
        database_id: 123e4567-e89b-12d3-a456-426614174000
    OrderByColumn:
      properties:
        kind:
          type: string
          const: column
          title: Kind
          default: column
        column:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Column
          description: Column to order by
          examples:
          - created_at
        direction:
          type: string
          enum:
          - ASC
          - DESC
          title: Direction
          default: ASC
      additionalProperties: false
      type: object
      required:
      - column
      title: OrderByColumn
      description: Order by a named column in ASC or DESC direction.
    WholeMatch:
      properties:
        mode:
          type: string
          const: whole
          title: Mode
          default: whole
        column:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
          title: Column
          description: Column to match against
          examples:
          - task_id
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          title: Value
          description: Value the column must equal (non-null).
      additionalProperties: false
      type: object
      required:
      - column
      - value
      title: WholeMatch
      description: 'Exact-match clause on a column value: `"col" = :param`.'
    InsertRowRequest:
      properties:
        values:
          additionalProperties: true
          type: object
          title: Values
          description: Map of column name to value. Keys must match existing columns of the table.
          examples:
          - hitl_output:
              foo: bar
            metadata:
              document_type: lufthansa
            task_id: '...'
      type: object
      required:
      - values
      title: InsertRowRequest
      description: Request to insert a single row into a managed-DB table.
    InsertRowResponse:
      properties:
        table_name:
          type: string
          title: Table Name
          description: Table name
        row:
          additionalProperties: true
          type: object
          title: Row
          description: The inserted row as returned by RETURNING *
      type: object
      required:
      - table_name
      - row
      title: InsertRowResponse
      description: Response containing the inserted row.
    PostgresCreateRequest:
      properties:
        host:
          type: string
          title: Host
        port:
          type: string
          title: Port
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
        database:
          type: string
          title: Database
        connection_string:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection String
      type: object
      required:
      - host
      - port
      - username
      - password
      - database
      title: PostgresCreateRequest
      description: PostgreSQL integration creation request model.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TableColumnsResponse:
      properties:
        table_name:
          type: string
          title: Table Name
          description: Table name
        columns:
          items:
            $ref: '#/components/schemas/TableColumn'
          type: array
          title: Columns
          description: List of columns
      type: object
      required:
      - table_name
      - columns
      title: TableColumnsResponse
      description: Response containing columns of a table.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable error message
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: Machine-readable error code for programmatic handling
        details:
          anyOf:
          - items:
              type: string
            type: array
          - items:
              additionalProperties: true
              type: object
            type: array
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: Additional error context, validation errors, or debugging information
      type: object
      required:
      - message
      title: ErrorDetail
      description: 'Standard error detail structure.


        This model matches the error format returned by the centralized

        exception handlers in app/api/errors/handlers.py.'
    FileUploadCompleteRequest:
      properties:
        upload_id:
          type: string
          title: Upload Id
          description: Upload identifier from prepare step
        table_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Table Name
          description: Override table name (optional)
        has_header:
          type: boolean
          title: Has Header
          description: Whether CSV has header row
          default: true
        delimiter:
          type: string
          title: Delimiter
          description: CSV delimiter character
          default: ','
      type: object
      required:
      - upload_id
      title: FileUploadCompleteRequest
      description: Request to complete file upload and process the file.
    UserIntegrationCredentialsCreate:
      properties:
        name:
          type: string
          title: Name
        provider:
          $ref: '#/components/schemas/ProviderApiEnum'
        credential_type:
          $ref: '#/components/schemas/CredentialTypeEnum'
        credentials:
          additionalProperties: true
          type: object
          title: Credentials
      type: object
      required:
      - name
      - provider
      - credential_type
      - credentials
      title: UserIntegrationCredentialsCreate
      description: Request model for creating user integration credentials
    ColumnDefinition:
      properties:
        name:
          type: string
          title: Name
          description: Column name
          examples:
          - email
        type:
          type: string
          title: Type
          description: PostgreSQL column type
          examples:
          - TEXT
          - INTEGER
          - BOOLEAN
          - TIMESTAMP
          - JSONB
          - UUID
        is_primary_key:
          type: boolean
          title: Is Primary Key
          description: Whether this column is part of the primary key
          default: false
        foreign_key:
          anyOf:
          - $ref: '#/components/schemas/ForeignKeyDefinition'
          - type: 'null'
          description: Foreign key constraint if this column references another table
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
          description: 'Optional column default expression. Restricted to a small set of safe forms: a function call like ''gen_random_uuid()'' or ''now()'', a SQL literal NULL/TRUE/FALSE, an integer, or a single-quoted string.'
          examples:
          - gen_random_uuid()
          - now()
          - '''pending'''
          - '0'
      type: object
      required:
      - name
      - type
      title: ColumnDefinition
      description: Definition of a table column.
    DocumentFileResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Document file ID
        name:
          type: string
          title: Name
          description: Document name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Document description
        database_type:
          type: string
          enum:
          - csv
          - postgres
          title: Database Type
          description: Type of database
        current_file_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Current File Id
          description: Current file ID in bucket
        current_table_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Table Name
          description: Current dataset name
        revision_count:
          type: integer
          title: Revision Count
          description: Number of file revisions
          default: 0
        total_rows:
          type: integer
          title: Total Rows
          description: Total rows in current file
          default: 0
        status:
          type: string
          title: Status
          description: File status
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
        modified_by:
