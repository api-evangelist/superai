        - POST /integrations/postgres/test-connection - Test new PostgreSQL credentials before updating

        - DELETE /integrations/credentials/{credential_id} - Delete credential instead of updating


        Security:

        - New credentials are encrypted before storage (same as creation)

        - Old credential data is overwritten (not preserved in database)

        - Audit trail tracks who performed the update via modified_by field

        - Test new credentials before updating to prevent workflow disruption


        Notes:

