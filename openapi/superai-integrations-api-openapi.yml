      description: 'Soft-delete an integration credential.


        Marks the credential as deleted without physically removing it from the database.

        Deleted credentials are excluded from list queries and cannot be used in workflows.


        Context:

        This endpoint safely removes credentials while preserving audit trail. Common scenarios:

        - User disconnects an integration from settings UI

        - Credential compromise detected (delete and recreate)

        - Integration no longer needed for workflows

        - OAuth token revoked by provider


        Soft deletion allows recovery if needed and maintains historical records for compliance.


        Use Cases:

        User clicks "Disconnect" button for SharePoint integration in settings UI.


        Remove compromised SFTP credentials before creating new ones with rotated password.


        Clean up unused credentials to reduce organization''s attack surface.

        Related Endpoints:

        - GET /integrations/credentials - List active credentials (excludes deleted)

        - GET /integrations/credentials/{credential_id} - Verify credential before deletion

        - POST /integrations/credentials - Create new credential to replace deleted one


        Security:

        - Soft deletion preserves audit trail for compliance

        - Encrypted credential data remains in database but inaccessible

        - Consider automatic credential rotation policies for sensitive environments

        - Deleted credentials cannot be restored via API (database admin required)


        Notes:

        - Deletion is immediate and cannot be undone via API

        - Workflows using this credential will fail after deletion

        - Check for dependent workflows before deleting credentials

        - OAuth tokens are not revoked at provider (user must revoke separately)'
