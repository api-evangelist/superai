      title: TaskExecutionAPI
      description: "API model representing a task execution within a flow.\n\nTask executions track individual task invocations during flow execution.\nEach task can execute multiple times (retries, loops), identified by\ntask_execution_idx. Contains full execution context including inputs,\noutputs, errors, and lifecycle metadata.\n\nResource Hierarchy:\n    Organization → Flow → Flow Execution → Task Execution"
    ListTaskExecutionsResponse:
      properties:
        task_executions:
          items:
            $ref: '#/components/schemas/TaskExecutionWithTagsAPI'
          type: array
          title: Task Executions
          description: Array of task execution objects matching the filter criteria. Each object includes full task execution details plus associated tags. Empty array if no executions match filters. Results are ordered by created_at descending (newest first).
      type: object
      required:
      - task_executions
      title: ListTaskExecutionsResponse
      description: 'Response model for listing task executions with filtering.


        Returns an array of task executions with their associated tags,

        filtered by the query parameters provided in the request.'
    TaskExecutionWithTagsAPI:
      properties:
        id:
          type: string
          format: uuid
