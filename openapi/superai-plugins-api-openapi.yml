openapi: 3.2.0
info:
  title: SuperAI Flow Platform Plugins API
  description: SuperAI Flows is a workflow orchestration platform that enables you to design, deploy, and monitor automated workflows at scale.
  version: 0.1.0
tags:
- name: Plugins
  description: Plugin operations for managing integration plugin instances, OAuth flows, and webhooks.
  x-displayName: Plugins
paths:
  /api/integrations/plugins/:
    get:
      tags:
      - Plugins
      summary: List all registered plugins
      description: 'List all registered plugins from the integration registry.


        Returns plugins available in the new plugin system only, excluding legacy integrations.

        Each plugin includes metadata about its capabilities, version, and status.


        Use Cases:

        - Display available integrations to users

        - Validate plugin availability before configuration

        - Integration discovery and selection'
      operationId: list_plugins_api_integrations_plugins__get
      responses:
        '200':
          description: List of plugins successfully retrieved
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Plugins Api Integrations Plugins  Get
        '401':
          description: Unauthorized - Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing authentication token
                  value:
                    error:
                      message: Authentication required
                      code: unauthorized
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      message: Invalid authentication token
                      code: unauthorized
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    error:
                      message: Internal server error
                      code: internal_error
                    request_id: 01K8KABR6S16YETA2SZPVBS9SP
                repository_error:
                  summary: Database error
                  value:
                    error:
                      message: Database operation failed
                      code: repository_error
                    request_id: 01K8KACP7D2XFGHJ9KLM4NPQR8
      security:
      - BearerAuth: []
      - APIKeyAuth: []
  /api/integrations/plugins/{plugin_name}/capabilities:
