  /api/flows/{flow_id}/invitations:
    put:
      tags:
      - flows
      summary: Upsert user invitations to a flow
      description: 'Upsert invitations for multiple users to access a flow.


        This endpoint allows admins to invite worker users to specific flows.

        Only users with the **worker role** will be invited - other users are automatically filtered out.

        Invited users will be able to access the flow and its executions through

        the RLS policies enforced at the database level.


        ## Permissions

        - Only org_admin role can create/update invitations

        - Users must belong to the same organization as the flow


        ## Behavior

        - **Upsert semantics**: Creates new invitations or updates existing ones

        - **Role filtering**: Only users with worker role are invited (others are skipped)

        - If a user_id doesn''t have worker role, it''s silently skipped

        - Returns both invited user IDs and skipped user IDs

        - All operations are performed in a single transaction


        ## Use Cases

        - Grant worker access to specific flows

        - Update existing invitations (refresh updated_at timestamp)

        - Manage flow-level permissions for review workflows

        - Enable selective flow visibility for team members


        ## Example

        If you send user_ids: [user1, user2, user3, user4] and only user1, user2, user3 have worker role:

        - Response will show invited_user_ids: [user1, user2, user3]

        - Response will show skipped_user_ids: [user4]'
      operationId: upsert_flow_invitations_api_flows__flow_id__invitations_put
      parameters:
      - name: flow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Flow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowInvitationRequest'
      responses:
        '200':
          description: Users successfully invited/updated for the flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowInvitationBulkResponse'
        '400':
          description: Bad Request - Invalid user IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User doesn't have permission to manage invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
