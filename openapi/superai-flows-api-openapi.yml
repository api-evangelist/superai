                  parameters:
                    document_url: '{{e264bc8d-d6d3-4bef-a18e-a27ad491cd26.document_url}}'
                    fields:
                    - columns: []
                      data_type: int
                      id: InvoiceID
                      instructions: ''
                      title: Invoice ID
                    worker: gpt-4.1
                  task_executor_name: doc_to_structured
                  task_title: Doc To Structured
                  visual_properties:
                    collapsed: false
                    position:
                      x: 1170
                      y: 360
                    zIndex: 2
              meta:
                description: Extract data from invoices
                name: Invoice Processing
      type: object
      required:
