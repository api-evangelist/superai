          additionalProperties: true
          type: object
          title: Definition
          description: Flow definition in DSL format. The definition contains a 'flow' metadata object and a 'flow_configs' array with task configurations. Each task has a unique 'name' (UUID), 'task_executor_name' (the task type), 'task_title' (display name), 'parameters' (executor-specific config), and optional 'visual_properties' for UI layout. Tasks reference upstream outputs using '{{task_name.output_field}}' template syntax in their parameters to define dependencies.
          examples:
          - flow:
              author_uuid: ''
              created_at: ''
            flow_configs:
            - config:
                groups: []
                notes: []
                tasks:
                - is_schedulable_executor: false
                  name: e264bc8d-d6d3-4bef-a18e-a27ad491cd26
                  parameters: {}
                  task_executor_name: receive_file
                  task_title: Receive File
                  visual_properties:
                    collapsed: false
                    position:
                      x: 584.5
                      y: 359.5
                    zIndex: 2
