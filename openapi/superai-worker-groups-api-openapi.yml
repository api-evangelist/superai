        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: New description for the worker group.
          examples:
          - Updated team description.
      type: object
      title: WorkerGroupUpdateRequest
      description: Request payload for updating an existing worker group.
    WorkerGroupResponse:
      properties:
