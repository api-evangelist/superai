          description: User's first name.
        last_name:
          type: string
          title: Last Name
          description: User's last name.
        email:
          type: string
          title: Email
          description: User's email address.
        role:
          type: string
          title: Role
          description: User's role.
        added_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Added At
          description: When the user was added to the group.
      type: object
      required:
