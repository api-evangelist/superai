              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowTaskStatusAPI'
                title: Response Add Flow Task Statuses Api Flow Executions  Flow Execution Id  Task Status Post
        '400':
          description: Bad Request - Invalid request body or task names
          content:
