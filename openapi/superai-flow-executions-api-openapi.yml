      - cancel_requested
      - cancelled
      title: ExecutionStatus
      description: "Valid status values for flow execution lifecycle.\n\nStatus Transitions:\n    queued → running → completed\n                     → failed\n\n    running/awaiting_input → cancel_requested → cancelled\n\n    Any status → deleted (soft delete)\n    completed → edited (user manually changed output)\n    completed/failed → stale (downstream data outdated due to upstream edit)\n\nStatus Definitions:\n    - queued: Execution created but workflow not yet started\n    - running: Workflow started, actively processing tasks\n    - completed: All tasks finished successfully\n    - failed: One or more tasks failed, workflow stopped\n    - deleted: Soft deleted, hidden from list operations\n    - stale: Previously completed but data is now outdated due to upstream edit\n    - edited: User manually changed task output\n    - cancel_requested: Cancellation requested, workflow being gracefully cancelled\n    - cancelled: Workflow cancelled by user"
